# CI: build (the strict TreatWarningsAsErrors/analyzers build IS the gate), run the test
# suite, and enforce the 100%-line-coverage gate from tests/Check-Coverage.ps1.
#
# Windows runner is mandatory: the test project is net10.0-windows (WinForms) and the E2E
# tests start a real Kestrel host on loopback.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  # Superseded PR runs are cancelled; pushes to the default branch always run to completion
  # so the final status on master is never from a stale commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build, test, coverage gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is load-bearing: the SetVersionFromGitCommitCount target in
          # Directory.Build.props stamps the assembly version from
          # `git rev-list --count HEAD`, and a shallow clone would silently produce 1.1.0.1.
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        # setup-dotnet's built-in cache cannot be used: it requires packages.lock.json
        # files and this repo has none (central package management only), so cache the
        # global packages folder directly, keyed on the central version pin file.
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ScannerService.slnx

      - name: Build
        # Warnings are errors (Directory.Build.props: TreatWarningsAsErrors + AnalysisMode=All
        # + SonarAnalyzer + EnforceCodeStyleInBuild), so a plain build is the full gate.
        run: dotnet build ScannerService.slnx -c Release --no-restore

      - name: Test with coverage collection
        # Keep the whole command single-quoted: the doubled quoting around the collector name
        # must reach dotnet intact or VSTest fails with "Could not find data collector".
        # No --results-directory: tests/Check-Coverage.ps1 scans the default
        # tests/ScannerService.UnitTests/TestResults location.
        # On failure, each failed test is emitted as a ::error:: check annotation so the
        # failure detail is readable from the public checks API without downloading logs.
        shell: pwsh
        run: |
          dotnet test tests/ScannerService.UnitTests/ScannerService.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --settings tests/coverage.runsettings --logger trx --blame --blame-crash 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/test-console.log"
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            # Crash-shaped failures (native fault / OOM) leave empty TRX messages or no
            # failed entries at all, so also surface the console tail and the blame
            # sequence (test in flight at host exit) as annotations - both are readable
            # from the public checks API without repo credentials.
            $runDir = Get-ChildItem 'tests/ScannerService.UnitTests/TestResults' -Directory |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            $trx = Get-ChildItem $runDir.FullName -Filter '*.trx' -Recurse | Select-Object -First 1
            if ($trx) {
              [xml] $doc = Get-Content -Raw $trx.FullName
              $failed = @($doc.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })
              Write-Host "Failed tests recorded in TRX: $($failed.Count)"
              foreach ($result in ($failed | Select-Object -First 10)) {
                $message = [string] $result.Message
                if ([string]::IsNullOrWhiteSpace($message)) { $message = [string] $result.StackTrace }
                if ([string]::IsNullOrWhiteSpace($message)) { $message = '(no message or stack in TRX - likely a host crash)' }
                $message = ($message -replace '\r?\n', ' ')
                if ($message.Length -gt 1200) { $message = $message.Substring(0, 1200) }
                Write-Host "FAILED TEST: $($result.testName)"
                Write-Host "  message: $message"
                Write-Host "::error::$($result.testName) - $message"
              }
            }
            $seq = Get-ChildItem $runDir.FullName -Filter 'Sequence.xml' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($seq) {
              $seqText = ((Get-Content -Raw $seq.FullName) -replace '\r?\n', ' ')
              if ($seqText.Length -gt 1500) { $seqText = $seqText.Substring($seqText.Length - 1500) }
              Write-Host "::error::BLAME sequence (last test in flight): $seqText"
            }
            $tail = (Get-Content "$env:RUNNER_TEMP/test-console.log" -Tail 20) -join ' | '
            if ($tail.Length -gt 3500) { $tail = $tail.Substring($tail.Length - 3500) }
            Write-Host "::error::dotnet test console tail: $tail"
          }
          exit $exit

      - name: Coverage gate
        # Fails when any coverable line is uncovered and not on the script's documented
        # allowlist, and reports allowlist entries that have become covered.
        # The gate runs as a child pwsh so its exit code is unambiguous (a terminating
        # Write-Error inside the script would not set $LASTEXITCODE in this session), and
        # its failure lines are re-emitted as ::error:: annotations so the uncovered line
        # list is readable from the public checks API without repo credentials.
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -File ./tests/Check-Coverage.ps1 2>&1 | Tee-Object -Variable gateOutput
          $output | ForEach-Object { Write-Host $_ }
          $exit = $LASTEXITCODE
          if ($exit -ne 0) {
            $interesting = @($gateOutput | Where-Object { "$_" -match 'uncovered lines not on the allowlist|no instrumented lines found|\[FAIL\]' } | Select-Object -First 10)
            foreach ($line in $interesting) {
              $text = ("$line" -replace '\r?\n', ' ')
              if ($text.Length -gt 1000) { $text = $text.Substring(0, 1000) }
              Write-Host "::error::$text"
            }
          }
          exit $exit

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # run_attempt keeps re-run attempts from colliding with the immutable artifact
          # of the same run_id (upload-artifact errors with 409 on "Re-run failed jobs").
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/ScannerService.UnitTests/TestResults/**/*.trx
            tests/ScannerService.UnitTests/TestResults/**/coverage.json
            tests/ScannerService.UnitTests/TestResults/**/Sequence.xml
          if-no-files-found: ignore
